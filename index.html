<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anniversary</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
  color: white;
  overflow-y: auto;
}

/* MOON */
.moon {
  position: fixed;
  top: 40px;
  right: 40px;
  width: 80px;
  height: 80px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 40px white;
  z-index: 2;
}

/* ⭐ STARS FIXED */
.stars {
  position: fixed;
  top: 0;
  right: 0;
  width: 100%;
  height: 200px;
  pointer-events: none;
  z-index: 1;
}

.star {
  position: absolute;
  color: white;
  font-size: 10px;
  animation: twinkle 1.5s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.2; }
  to { opacity: 1; }
}

/* CARD */
.card {
  background: rgba(0,0,0,0.6);
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  width: 95%;
  max-width: 500px;
  margin: auto;
  margin-top: 80px;
}

h1 {
  font-family: 'Great Vibes', cursive;
  color: #ff4d6d;
}

button {
  padding: 10px 20px;
  border: none;
  background: #ff4b5c;
  color: white;
  border-radius: 20px;
  cursor: pointer;
}

#main { display: none; }

/* TEXT */
#text {
  white-space: pre-line;
  text-align: left;
  font-size: 14px;
}

/* 📅 CALENDAR */
.calendar {
  margin-top: 20px;
  background: rgba(255,255,255,0.05);
  padding: 15px;
  border-radius: 15px;
}

.calendar h3 {
  margin: 0 0 10px;
  color: #ff4d6d;
}

.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  font-size: 12px;
}

.day {
  padding: 6px;
  border-radius: 8px;
}

.highlight {
  background: #ff4d6d;
  color: white;
  box-shadow: 0 0 10px #ff4d6d;
  animation: glow 1s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 5px #ff4d6d; }
  to { box-shadow: 0 0 18px #ff4d6d; }
}

/* LOVE TEXT FIX */
#loveText {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 28px;
  color: #ff1e56;
  background: rgba(255,255,255,0.9);
  padding: 15px 25px;
  border-radius: 15px;
  z-index: 9999;

  white-space: nowrap; /* ✅ ONE LINE */
}

.show {
  display: block !important;
  animation: boom 0.6s ease forwards;
}

@keyframes boom {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  80% { transform: translate(-50%, -50%) scale(1.2); }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

/* BOX */
.box {
  font-size: 45px;
  cursor: pointer;
  margin-top: 20px;
  transition: 0.3s;
}

.box.active {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(2);
}

/* RAIN */
.rain {
  position: fixed;
  top: -10px;
  font-size: 18px;
  animation: fall linear forwards;
}

@keyframes fall {
  to { transform: translateY(110vh); opacity: 0; }
}

/* BLAST */
.blast {
  position: fixed;
  animation: explode 1s forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}
</style>

</head>

<body>

<div class="moon"></div>

<div class="card" id="intro">
  <h1>𝑵𝒂𝒉𝒊𝒅 & 𝑩𝒓𝒊𝒔𝒕𝒚’𝒔 𝑭𝒊𝒓𝒔𝒕 𝑨𝒏𝒏𝒊𝒗𝒆𝒓𝒔𝒂𝒓𝒚 ❤️</h1>

  <div class="calendar">
    <h3>April 2026</h3>
    <div class="days">
      <div></div><div></div><div></div><div></div><div></div>
      <div class="day">1</div>
      <div class="day highlight">2</div>
      <div class="day">3</div><div class="day">4</div><div class="day">5</div>
      <div class="day">6</div><div class="day">7</div><div class="day">8</div>
      <div class="day">9</div><div class="day">10</div><div class="day">11</div>
      <div class="day">12</div><div class="day">13</div><div class="day">14</div>
      <div class="day">15</div><div class="day">16</div><div class="day">17</div>
      <div class="day">18</div><div class="day">19</div><div class="day">20</div>
      <div class="day">21</div><div class="day">22</div><div class="day">23</div>
      <div class="day">24</div><div class="day">25</div><div class="day">26</div>
      <div class="day">27</div><div class="day">28</div><div class="day">29</div>
      <div class="day">30</div>
    </div>
  </div>

<button onclick="start()">Next</button>

</div>

<div class="card" id="main">
  <button onclick="location.reload()">⬅ Back</button>
  <div id="text"></div>

  <h3>তোমার জন্য একটা সারপ্রাইজ আছে 🎁</h3>
  <p>সারপ্রাইজ বক্সটা খুলে দেখো</p>

  <div class="box" id="giftBox" onclick="surprise(event)">🎁</div>
</div>

<div id="loveText">I LOVE YOU JANTUS ❤️</div>

<script>
const message = `আজ আমাদের বিবাহিত জীবনের ১ টা বছর পূরন হয়ে গেলো,কিন্তু গল্প টা প্রায় ৫ বছর আগে থেকেই শুরু হয়ছিলো।যেদিন তুমি আমাদের বাড়িতে আসছিলে, তোমাকে প্রথম দেখেই আমি একেবার ফিদা হয়ে গেছিলাম।আমি তখনো বুঝি নাই, তুমি একদিন আমার জীবনের সব কিছু হয়ে যাবা, আল্লাহর কাছে লাখ লাখ শুকরিয়া, আমার কপালে তোমার মতো একটা মেয়ে লিখে রাখছিলো,তোমার মতো জীবন সঙ্গি  পাওয়া ভাগ্যের ব্যাপার।

তোমার ওই দুই চোখ… এখনো আমারে আগের মতোই ঘায়েল করে।
আর তুমি যখন কাজের মাঝে আমাকে জালাও—রাগ লাগে, কিন্তু ভিতরে ভিতরে ভালোও লাগে… কারণ এটা তুমি। 😌

আমাদের ঝগড়া হয়, অনেক হয়…
আমি রাগ করি, সন্দেহ করি, তোমার কাছে আদর চাই… হয়তো একটু বেশিই চাই।
কারণটা একটাই—আমি তোমাকে অনেক বেশি ভালোবাসি।
তোমাকে কাছে না পেলে, তোমার একটু আদর না পেলে, আমার ভিতরটা অস্থির হয়ে যায়।

তুমি সবসময় এসে আমাকে বুঝাও, মানাও…
এই জিনিসটা আমি হয়তো ঠিকভাবে কখনো বলি না, কিন্তু এটা আমার কাছে অনেক বড় কিছু।

মনে আছে?
রাস্তার মাঝে দাঁড়িয়ে তোমার কপালে প্রথম কিসটা…
সেদিন সত্যি আমি কেঁপে গেছিলাম।
আর আজও সেই ফিলটা একটুও কমে নাই।

তুমি আমার জীবনে আসার পর আমি নতুন করে নিজেকে চিনেছি…
তোমার ভালোবাসা আমাকে কখনো বাচ্চার মতো সরল করে দেয়,
আর তোমার জন্যই আমি নিজের সব দায়িত্ব বুঝে নিতে শিখেছি।

শোনো জান্টুস,
আমি চাই আমাদের এই ঝগড়া, অভিমান, ভালোবাসা—সব কিছু নিয়েই আমরা সারাজীবন একসাথে থাকি।
আর একদিন আমাদের ছোট্ট একটা দুনিয়া হোক…
একটা আয়াত, আর একটা রাফি 

শুভ বিবাহবার্ষিকী, আমার জানু ❤️
আর হ্যাঁ…
এখনো কিন্তু তোমার কাছে আমার একটা কমপ্লেইন আছে—
আমি একটু বেশি আদর চাই… তুমি এখনো কম দাও 😏💕`;

let i = 0;
let opened = false;

function start() {
  document.getElementById("intro").style.display = "none";
  document.getElementById("main").style.display = "block";
  typeWriter();
  rain();
}

function typeWriter() {
  if (i < message.length) {
    document.getElementById("text").innerHTML += message[i];
    window.scrollTo(0, document.body.scrollHeight);
    i++;
    setTimeout(typeWriter, 20);
  }
}

function rain() {
  setInterval(() => {
    let el = document.createElement("div");
    el.className = "rain";
    el.innerHTML = Math.random() > 0.5 ? "💖" : "🌸";
    el.style.left = Math.random()*100+"vw";
    el.style.animationDuration = (3+Math.random()*2)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),5000);
  },200);
}

function surprise(e) {
  e.stopPropagation();

  let box = document.getElementById("giftBox");

  if (!opened) {
    opened = true;
    box.classList.add("active");

    let text = document.getElementById("loveText");
    text.classList.add("show");

    for (let i = 0; i < 40; i++) {
      let b = document.createElement("div");
      b.innerHTML = "💖";
      b.className = "blast";

      b.style.setProperty('--x', (Math.random()-0.5)*300+'px');
      b.style.setProperty('--y', (Math.random()-0.5)*300+'px');

      b.style.left="50%";
      b.style.top="50%";

      document.body.appendChild(b);
      setTimeout(()=>b.remove(),1000);
    }

  } else {
    reset();
  }
}

document.addEventListener("click", ()=>{
  if(opened) reset();
});

function reset(){
  opened=false;
  document.getElementById("giftBox").classList.remove("active");
  document.getElementById("loveText").classList.remove("show");
}
</script>

</body>
</html>
